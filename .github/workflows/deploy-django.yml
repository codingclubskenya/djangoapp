name: Deploy Django API to Server

on:
  push:
    branches: [ "master", "joe" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations check
        run: |
          python -c "import django, os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'deheus_api.settings'); django.setup(); from django.core.management import call_command; call_command('makemigrations', '--check', '--dry-run')"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/joe' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/devops/deheus-api-django
            git pull origin joe
            /home/devops/deheus-api-django/venv/bin/pip install -r requirements.txt
            /home/devops/deheus-api-django/venv/bin/python manage.py migrate --noinput
            /home/devops/deheus-api-django/venv/bin/python manage.py collectstatic --noinput
            sudo systemctl restart gunicorn
            echo "Django API deployed successfully"
